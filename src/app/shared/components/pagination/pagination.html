<div class="join flex justify-center mt-5 items-center">
  @for (page of getPagesList(); track page) {
    <button
      class="join-item btn btn-square"
      [class.btn-primary]="activePage() === page"
      [routerLink]="[]"
      [queryParams]="{ page: page }"
      (click)="activePage.set(page)"
    >
      {{ page }}
    </button>
  } @empty {
    <p>No hay paginas</p>
  }
</div>
