<h1 class="text-3xl font-bold font-montserrat mt-5">Todos los productos</h1>
<h2 class="text-xl mb-5">Para {{ genderTitle() }}</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">
  @for (product of productsResource.value()?.products; track product.id) {
    <product-card [product]="product" />
  }
</div>

<app-pagination
  [numOfPages]="productsResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
/>
